name: Build Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Godot Android project
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot"
          cp -r /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/"

      - name: Validate Godot project
        run: godot --headless --path . --quit

      - name: Export Android package
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Monopoly.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-build
          path: build/Monopoly.apk
          retention-days: 14
